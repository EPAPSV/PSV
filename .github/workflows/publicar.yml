name: Publicar BiblioPólo

on:
  # 1) sempre que mudas ficheiros no repositório (ex.: index.html, detalhes.json)
  push:
    branches: [main]
  # 2) sempre que o Power Automate envia a lista de livros do Excel
  repository_dispatch:
    types: [atualizar-livros]
  # 3) botão manual (separador Actions → Run workflow)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4

      - name: Gravar Biblioteca/livros.json (só quando vem do Power Automate)
        id: dados
        if: github.event_name == 'repository_dispatch'
        run: |
          set -e
          jq '[.client_payload.dados.livros[] | select((.ID // "") != "") | {id: (.ID|tostring), titulo: (.Livro|tostring), autor: ((.Autor // "")|tostring), origem: ((.Origem // "")|tostring), estado: (if ((.Estado // "")|tostring) == "" then "Disponível" else (.Estado|tostring) end), disponivelAPartir: (if ((."Data prevista de devolução" // "")|tostring) != "" then ((."Data prevista de devolução"|tostring)[0:10]) elif (((.Estado // "")|tostring) != "" and ((.Estado // "")|tostring) != "Disponível" and (((."Data de pedido" // "")|tostring) | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}"))) then ((((."Data de pedido"|tostring)[0:10] + "T00:00:00Z") | fromdateiso8601) + 2592000 | todate | .[0:10]) else null end)}] | sort_by(.titulo | ascii_downcase)' "$GITHUB_EVENT_PATH" > novos.json
          # Segurança: só aceita se tiver uma lista com tamanho razoável
          jq -e 'length > 50' novos.json > /dev/null
          if [ "$(jq -c '.livros' Biblioteca/livros.json)" != "$(jq -c '.' novos.json)" ]; then
            jq --arg agora "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{atualizado: $agora, livros: .}' novos.json > Biblioteca/livros.json
            git config user.name  "biblio-bot"
            git config user.email "biblio-bot@users.noreply.github.com"
            git add Biblioteca/livros.json
            git commit -m "Atualizar lista de livros"
            git push
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            echo "Sem alterações na lista de livros."
          fi
          rm -f novos.json

      - name: Preparar publicação
        if: github.event_name != 'repository_dispatch' || steps.dados.outputs.mudou == 'true'
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        if: github.event_name != 'repository_dispatch' || steps.dados.outputs.mudou == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar no GitHub Pages
        id: deployment
        if: github.event_name != 'repository_dispatch' || steps.dados.outputs.mudou == 'true'
        uses: actions/deploy-pages@v4
